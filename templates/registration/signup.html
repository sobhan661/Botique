{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
  SignUp
{% endblock title %}

{% block content %}
  <h1>
    SignUp
  </h1>
  <div class="container">
    <form action="" method="post"> {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-success" type="submit">
        Save
      </button>
    </form>
    <p></p>
      <a class="btn btn-info" href="{% url 'home' %}">
        Go back to home
      </a>
  </div>
{% endblock content %}
