{% extends "base.html" %}

{% block title %}
  Items
{% endblock title %}

{% block content %}
  <h1>
    All Items
  </h1>
  <h4>
    <a href="{% url 'home' %}">
      Go back to home
    </a>
  </h4>
  {% for item in items %}
    <h2>
      <a href="{% url 'item' item.pk %}">
        {{ item.name }}
      </a>
    </h2>
  {% endfor %}
{% endblock content %}
